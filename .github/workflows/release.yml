name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（如 0.1.0，不需要加 v 前缀）'
        required: true
        type: string
      prerelease:
        description: '标记为预发布版本'
        required: false
        type: boolean
        default: false
      draft:
        description: '创建为草稿（不立即发布）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.onlyBuiltDependencies=@parcel/watcher,esbuild

      - name: Build frontend
        run: pnpm build

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag && format('v{0}', inputs.tag) || github.ref_name }}
          releaseName: JSON 工具箱 ${{ inputs.tag && format('v{0}', inputs.tag) || github.ref_name }}
          releaseBody: |
            GitHub Actions 自动构建 Windows 安装包和 Tauri 更新元数据。

            更新方式：安装旧版本后，在「设置 → 关于 → 检查更新」中检查 GitHub Releases 更新。
          releaseDraft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          args: --target x86_64-pc-windows-msvc
